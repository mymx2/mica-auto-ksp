# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync Upstream Template

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  sync-upstream:
    if: github.repository == 'mymx2/mica-auto-ksp'
    runs-on: ubuntu-latest

    steps:
      - name: 📸 Snapshot Workflow Context
        env:
          CONTEXT_GITHUB: ${{ toJSON(github) }}
        run: echo "$CONTEXT_GITHUB"

      - name: ✈ Checkout default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: 📦 Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          run-install: false

      - name: 🔄 Run sync script
        run: node .github/workflows/shell/sync.ts

      - name: 💾 Create PR with sync changes
        id: auto-pr-sync
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto-pr/sync-upstream"
          commit-message: "chore: sync upstream template [skip ci]"
          title: "chore: sync upstream template [skip ci]"
          labels: |
            pr|chore
          body: |
            ## Summary

            This PR syncs configuration files from the upstream template repository.

            - **Upstream**: mymx2/starter-gradle
            - **Script**: `.github/workflows/shell/sync.ts`

      - name: 🔧 Show PR info
        env:
          PR_INFO: ${{ toJSON(steps.auto-pr-sync.outputs) }}
        run: |
          echo "PR info: $PR_INFO"

      - name: ⏸ Pause for VSCode Debug
        env:
          ACTION_DEBUG_TOKEN: ${{ secrets.ACTION_DEBUG_TOKEN }}
          CONTEXT_GITHUB: ${{ toJSON(github) }}
          CONTEXT_JOB: ${{ toJSON(job) }}
          CONTEXT_STEPS: ${{ toJSON(steps) }}
          CONTEXT_RUNNER: ${{ toJSON(runner) }}
          CONTEXT_MATRIX: ${{ toJSON(matrix) }}
          CONTEXT_NEEDS: ${{ toJSON(needs) }}
          CONTEXT_INPUTS: ${{ toJSON(inputs) }}
        if: env.ACTION_DEBUG_TOKEN != '' && (failure() || vars.ACTION_DEBUG_WORKFLOW == github.workflow)
        uses: fawazahmed0/action-debug-vscode@b86399d1033aab18cf8f962fc7f634f39c9945ec # v3
        with:
          token: ${{ env.ACTION_DEBUG_TOKEN }}
